[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygridmappr"
version = "0.1.1"
description = "Python implementation of the R gridmappr package for grid map allocation"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.8"
authors = [{ name = "TMFNK" }]
keywords = ["gridmap", "spatial", "cartography", "grid", "allocation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/TMFNK/pygridmappr"
Repository = "https://github.com/TMFNK/pygridmappr"
Issues = "https://github.com/TMFNK/pygridmappr/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pygridmappr*"]
exclude = ["tests*", "examples*", "build*", "dist*"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
